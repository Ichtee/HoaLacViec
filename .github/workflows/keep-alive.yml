name: Keep Backend Alive

on:
  schedule:
    # Runs every 10 minutes (cron: UTC time)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        run: |
          curl -sS --max-time 60 https://hoalacviec.onrender.com/api/health || echo "Ping failed or server waking up"

