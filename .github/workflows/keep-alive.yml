name: Keep Backend Alive

on:
  schedule:
    # Runs every 10 minutes from 00:00 to 16:00 UTC (07:00 to 23:59 GMT+7 Vietnam Time)
    # Total: ~17 hours/day * 30 days = ~510 hours/month (Well within Render's 750 free hours)
    - cron: '*/10 0-16 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        run: |
          curl -sS --max-time 60 https://hoalacviec.onrender.com/api/health || echo "Ping failed or server waking up"

