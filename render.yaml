services:
  - type: web
    name: hoalacviec-backend
    runtime: docker
    dockerfilePath: server/Dockerfile
    dockerContext: server
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: FRONTEND_URL
        value: https://client-orcin-two-27.vercel.app
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SERPAPI_API_KEY
        sync: false

